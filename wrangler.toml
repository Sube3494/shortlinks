#:schema node_modules/wrangler/config-schema.json
name = "shortlinks"
main = "main.py"
compatibility_date = "2026-01-09"
compatibility_flags = ["python_workers"]

[vars]
IS_CLOUDFLARE = "true"

# ==================== 数据库配置说明 ====================
# 本项目使用 sqlalchemy-cloudflare-d1 驱动，通过环境变量连接 D1
# 不需要在此配置 [[d1_databases]] 绑定
# 
# 必需的环境变量（在 Worker 设置中配置）：
# - CLOUDFLARE_ACCOUNT_ID
# - CLOUDFLARE_API_TOKEN
# - D1_DATABASE_ID
# - ADMIN_KEY
# - ADMIN_PATH
#
# 详见 CLOUDFLARE_DEPLOY.md

[assets]
directory = "./static"
binding = "ASSETS"
