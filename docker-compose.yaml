version: '3.8'

services:
  shortlink:
    build: .
    container_name: shortlink-app
    restart: unless-stopped
    environment:
      # ==================== 可选配置 ====================
      - BASE_URL=  # 可选：短链服务基础 URL (例: https://s.example.com)，留空将从请求自动推导
      - ADMIN_PATH=/admin  # 可选：自定义管理后台路径，默认 /admin
      
      # ==================== 必需配置 ====================
      - ADMIN_KEY=your-super-secret-admin-key  # 必需：管理员密钥
      - DATABASE_URL=file:./data/shortlinks.db  # 必需：数据库连接字符串
    ports:
      - "18000:8000"
    volumes:
      - ./data:/app/data
