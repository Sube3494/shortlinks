    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = window.location.origin;
        let currentBatchResults = [];
        let selectedCodes = new Set();
        // 分页状态
        let currentPage = 1;
        const pageSize = 5;

        // 初始化
        window.onload = () => {
            // 加载保存的 API Key
            const savedKey = localStorage.getItem('shortlink_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            
            // 初始化主题
            initTheme();
            
            loadLinks();

            // 点击外部关闭下拉框
            document.addEventListener('click', (e) => {
                const selects = document.querySelectorAll('.custom-select');
                selects.forEach(select => {
                    if (!select.contains(e.target)) {
                        select.classList.remove('active');
                    }
                });
            });
        };

        // 自定义下拉框逻辑
        function toggleCustomSelect(type) {
            const select = document.getElementById(`customSelect-${type}`);
            // 关闭其他下拉框
            document.querySelectorAll('.custom-select').forEach(s => {
                if (s !== select) s.classList.remove('active');
            });
            select.classList.toggle('active');
        }

        function selectOption(type, value, text, e) {
            e.stopPropagation();
            const select = document.getElementById(`customSelect-${type}`);
            const input = document.getElementById(type === 'single' ? 'expiresUnit' : 'batchExpiresUnit');
            const display = document.getElementById(`selected-${type}`);
            
            input.value = value;
            display.textContent = text;
            select.classList.remove('active');
            
            // 更新选中状态样式
            select.querySelectorAll('.option-item').forEach(item => {
                if (item.textContent === text) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // 主题相关
        function initTheme() {
            let savedTheme = null;
            try {
                // 1. 优先读取本地存储 (包裹 try-catch 以防隐身模式报错)
                savedTheme = localStorage.getItem('theme');
            } catch (e) {
            }
            
            if (savedTheme) {
                setTheme(savedTheme, false);
            } else {
                // 2. 其次跟随系统
                let systemDark = false;
                try {
                    systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                } catch(e) {}
                setTheme(systemDark ? 'dark' : 'light', false);
            }

            // 3. 监听系统主题变化
            try {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    // 只有当用户没有手动设置过主题时(且localStorage可用)，才跟随系统变动
                    try {
                        if (!localStorage.getItem('theme')) {
                            setTheme(e.matches ? 'dark' : 'light', true);
                        }
                    } catch (e) {}
                });
            } catch (e) {
                // 老旧浏览器兼容
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme, true);
        }

        function setTheme(theme, animate = true) {
            document.documentElement.setAttribute('data-theme', theme);
            
            try {
                localStorage.setItem('theme', theme);
            } catch (e) {
                // 某些移动端浏览器隐身模式下 setItem 会报错
            }
            
            const icon = document.querySelector('.theme-toggle i');
            if (!icon) return;
            
            // Dark Mode 显示太阳 (切换到 Light)
            // Light Mode 显示月亮 (切换到 Dark)
            const targetClass = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            
            if (animate) {
                icon.style.transform = 'scale(0.5) rotate(180deg)';
                icon.style.opacity = '0';
                
                setTimeout(() => {
                    icon.className = targetClass;
                    icon.style.transform = 'scale(1) rotate(0)';
                    icon.style.opacity = '1';
                }, 200);
            } else {
                icon.className = targetClass;
                // 确保样式重置
                icon.style.transform = 'scale(1) rotate(0)';
                icon.style.opacity = '1';
            }
            
            // 移动端元数据颜色适配
            const metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
                metaThemeColor.content = theme === 'dark' ? '#0f172a' : '#ffffff';
            }
        }

        // 界面交互
        function switchTab(mode) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');
            
            const singleMode = document.getElementById('singleMode');
            const batchMode = document.getElementById('batchMode');
            
            singleMode.style.display = mode === 'single' ? 'block' : 'none';
            batchMode.style.display = mode === 'batch' ? 'block' : 'none';
            document.getElementById('singleResult').style.display = 'none';
            document.getElementById('batchResult').style.display = 'none';
        }

        function openSettings() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
            
            // 加载已保存的设置
            const savedKey = localStorage.getItem('shortlink_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
            
            // 显示骨架屏占位
            const keyInfoDiv = document.getElementById('keyInfo');
            keyInfoDiv.innerHTML = `
                <div class="loading-skeleton" style="height: 24px; width: 60%; margin-bottom: 12px; border-radius: 4px;"></div>
                <div class="loading-skeleton" style="height: 20px; width: 40%; margin-bottom: 8px; border-radius: 4px;"></div>
                <div class="loading-skeleton" style="height: 20px; width: 50%; border-radius: 4px;"></div>
            `;
            keyInfoDiv.style.display = 'block';
            keyInfoDiv.style.opacity = '1';
            
            // 异步加载 Key 信息
            loadKeyInfo();
        }

        function closeSettings(e) {
            if (e.target === document.getElementById('settingsModal')) {
                const modal = document.getElementById('settingsModal');
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            }
        }

        function saveSettings() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('shortlink_api_key', key);
            } else {
                localStorage.removeItem('shortlink_api_key');
            }
            
            const modal = document.getElementById('settingsModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
            
            showToast('设置已保存', 'success');
            loadLinks(1);  // 重置到第一页
            
            // 加载 Key 信息
            loadKeyInfo();
        }

        // 工具函数
        function getHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            const apiKey = document.getElementById('apiKey').value;
            if (apiKey) headers['X-API-Key'] = apiKey;
            return headers;
        }

        // 解析 API 返回的时间（无论是 UTC 还是本地时间）
        function parseApiDate(dateString) {
            if (!dateString) return new Date();
            // 如果是字符串且看起来像 ISO 格式但没有时区信息，默认视为 UTC
            if (typeof dateString === 'string' && dateString.indexOf('T') > -1 && !dateString.endsWith('Z') && !dateString.includes('+')) {
                return new Date(dateString + 'Z');
            }
            return new Date(dateString);
        }

        // 格式化时间为 YYYY-MM-DD HH:mm:ss
        function formatDateTime(dateString) {
            const date = parseApiDate(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                <span>${msg}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success'))
                .catch(() => showToast('复制失败', 'error'));
        }

        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const text = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.loading-spinner');
            btn.disabled = isLoading;
            text.style.display = isLoading ? 'none' : 'block';
            spinner.style.display = isLoading ? 'inline-block' : 'none';
        }

        // 业务逻辑
        async function createShortLink() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showToast('请先在设置中填写 API 密钥', 'error');
                openSettings();
                return;
            }

            const longUrl = document.getElementById('longUrl').value.trim();
            if (!longUrl) return showToast('请输入长链接', 'error');

            setLoading('createBtn', true);
            document.getElementById('singleResult').style.display = 'none';

            try {
                const data = { url: longUrl };
                const code = document.getElementById('customCode').value.trim();
                const expiresValue = document.getElementById('expiresValue').value.trim();
                const expiresUnit = document.getElementById('expiresUnit').value;
                
                if (code) data.custom_code = code;
                if (expiresValue) {
                    const val = parseInt(expiresValue);
                    if (expiresUnit === 'days') {
                        data.expires_in_days = val;
                    } else if (expiresUnit === 'minutes') {
                        data.expires_in_minutes = val;
                    } else {
                        data.expires_in_hours = val;
                    }
                }
                
                const title = document.getElementById('linkTitle').value.trim();
                if (title) data.title = title;

                const res = await fetch(`${API_BASE}/api/shorten`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    const link = `<a href="${result.short_url}" target="_blank">${result.short_url}</a>`;
                    document.getElementById('shortUrlText').innerHTML = link;
                    
                    const expiresDiv = document.getElementById('expiresInfo');
                    if (result.expires_at) {
                        expiresDiv.innerHTML = `<i class="fas fa-hourglass-half"></i> 有效期至: ${parseApiDate(result.expires_at).toLocaleString()}`;
                    } else {
                        expiresDiv.innerHTML = '<i class="fas fa-infinity"></i> 永久有效';
                    }

                    document.getElementById('singleResult').style.display = 'block';
                    document.getElementById('longUrl').value = '';
                    document.getElementById('customCode').value = '';
                    document.getElementById('expiresValue').value = '';
                    document.getElementById('linkTitle').value = '';
                    document.getElementById('expiresUnit').value = 'minutes'; // Reset unit
                    loadLinks(1);  // 重置到第一页
                    showToast('创建成功', 'success');
                } else {
                    showToast(result.detail || '创建失败', 'error');
                }
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setLoading('createBtn', false);
            }
        }

        function copyShortLink() {
            const url = document.querySelector('#shortUrlText a')?.href;
            if (url) copyText(url);
        }

        function openShortLink() {
            const url = document.querySelector('#shortUrlText a')?.href;
            if (url) window.open(url, '_blank');
        }

        async function createBatchShortLinks() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showToast('请先在设置中填写 API 密钥', 'error');
                openSettings();
                return;
            }

            const text = document.getElementById('batchUrls').value.trim();
            if (!text) return showToast('请输入链接', 'error');

            const urls = text.split('\n').map(u => u.trim()).filter(u => u);
            if (urls.length === 0) return;

            setLoading('batchBtn', true);
            document.getElementById('batchResult').style.display = 'none';

            try {
                const data = { urls };
                const expiresValue = document.getElementById('batchExpiresValue').value.trim();
                const expiresUnit = document.getElementById('batchExpiresUnit').value;
                const batchTitle = document.getElementById('batchTitle').value.trim();
                
                if (expiresValue) {
                    const val = parseInt(expiresValue);
                    if (expiresUnit === 'days') {
                        data.expires_in_days = val;
                    } else if (expiresUnit === 'minutes') {
                        data.expires_in_minutes = val;
                    } else {
                        data.expires_in_hours = val;
                    }
                }
                if (batchTitle) data.title = batchTitle;

                const res = await fetch(`${API_BASE}/api/shorten/batch`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    currentBatchResults = result;
                    const html = result.map((link, index) => {
                        const encodedOriginalUrl = encodeURI(link.original_url);
                        return `
                            <div class="batch-item fade-in-up" style="animation-delay: ${index * 0.05}s">
                                <div class="batch-item-info">
                                    <div class="batch-item-url">${link.short_url}</div>
                                    <div class="batch-item-original">${encodedOriginalUrl}</div>
                                </div>
                                <button class="icon-btn" onclick="copyText('${link.short_url}')">
                                    <i class="far fa-copy"></i>
                                </button>
                            </div>
                        `;
                    }).join('');

                    document.getElementById('batchList').innerHTML = html;
                    document.getElementById('batchResult').style.display = 'block';
                    document.getElementById('batchUrls').value = '';
                    document.getElementById('batchExpiresValue').value = '';
                    document.getElementById('batchTitle').value = '';
                    document.getElementById('batchExpiresUnit').value = 'minutes';
                    loadLinks(1);  // 重置到第一页
                    showToast(`批量创建成功 ${result.length} 个`, 'success');
                } else {
                    showToast(result.detail || '批量创建失败', 'error');
                }
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setLoading('batchBtn', false);
            }
        }

        function copyAllBatchUrls() {
            if (!currentBatchResults.length) return;
            copyText(currentBatchResults.map(l => l.short_url).join('\n'));
        }

        async function loadLinks(page = 1) {
            currentPage = page;
            const skip = (page - 1) * pageSize;
            
            // 清理选择状态
            selectedCodes.clear();
            updateBatchBar();
            
            const container = document.getElementById('linksContainer');
            container.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 3px; border-color: rgba(99, 102, 241, 0.1); border-top-color: var(--primary);"></div>
                    <div class="state-desc" style="margin-top: 16px;">正在加载您的链接...</div>
                </div>`;

            try {
                const res = await fetch(`${API_BASE}/api/list?skip=${skip}&limit=${pageSize}`, { 
                    headers: getHeaders() 
                });
                
                // 检查认证错误
                if (res.status === 401 || res.status === 403) {
                    const isInvalidKey = res.status === 403;
                    const iconColor = isInvalidKey ? 'var(--error)' : 'var(--primary)';
                    const iconBg = isInvalidKey ? 'rgba(239, 68, 68, 0.1)' : 'var(--primary-light)';
                    const message = isInvalidKey 
                        ? '您保存的密钥无效或已过期，请检查后重新设置' 
                        : '请点击卡片右上角设置图标 <i class="fas fa-cog" style="color: var(--primary);"></i> 填写密钥后使用';
                    
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="state-icon" style="background: ${iconBg}">
                                <i class="fas ${isInvalidKey ? 'fa-exclamation-triangle' : 'fa-key'}" style="color: ${iconColor};"></i>
                            </div>
                            <p class="state-desc">${message}</p>
                        </div>`;
                    return;
                }
                
                if (!res.ok) throw new Error('加载失败');
                const links = await res.json();

                if (!links.length && page === 1) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="state-icon">
                                <i class="fas fa-inbox"></i>
                            </div>
                            <h3 class="state-title">空空如也</h3>
                            <p class="state-desc">暂无记录，快来创建一个吧！</p>
                        </div>`;
                    updatePagination(0);
                    return;
                }

                container.innerHTML = links.map((link, index) => {
                    const isExpired = link.expires_at && parseApiDate(link.expires_at) < new Date();
                    const isSelected = selectedCodes.has(link.short_code);
                    
                    return `
                        <div class="link-card fade-in-up ${isExpired ? 'expired' : ''}" 
                             style="animation-delay: ${index * 0.1}s; ${isSelected ? 'background: var(--selection-bg); border-color: var(--primary);' : ''}">
                            <div style="display: flex; align-items: flex-start; gap: 16px; flex: 1; min-width: 0;">
                                <div style="padding-top: 1px;">
                                    <input type="checkbox" class="link-checkbox" 
                                        onclick="toggleSelection('${link.short_code}', event)" 
                                        ${isSelected ? 'checked' : ''}>
                                </div>
                                <div class="link-info">
                                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px;">
                                        <h3 style="margin: 0; font-size: 1.05rem;">
                                            <a href="${link.short_url}" target="_blank">${link.short_url}</a>
                                        </h3>
                                        ${link.title ? `<span style="background: var(--primary-light); color: var(--primary); padding: 2px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; border: 1px solid hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.1);">${link.title}</span>` : ''}
                                        ${isExpired ? '<span class="expired-tag">已过期</span>' : ''}
                                    </div>
                                    <div class="link-meta">
                                        <span class="link-tag"><i class="far fa-clock"></i> ${formatDateTime(link.created_at)}</span>
                                        <span class="link-tag"><i class="far fa-eye"></i> ${link.click_count} 访问</span>
                                        ${link.expires_at ? 
                                            `<span class="link-tag ${isExpired ? 'expired-tag' : ''}"><i class="fas fa-hourglass-half"></i> ${formatDateTime(link.expires_at)}</span>` : 
                                            '<span class="link-tag"><i class="fas fa-infinity"></i> 永久有效</span>'}
                                    </div>
                                </div>
                            </div>
                            <div class="link-actions">
                                <button class="action-btn" onclick="copyText('${link.short_url}')" title="复制">
                                    <i class="far fa-copy"></i>
                                </button>
                                <button class="action-btn" onclick="window.open('${link.short_url}', '_blank')" title="立即开启">
                                    <i class="fas fa-external-link-alt"></i>
                                </button>
                                <button class="action-btn" onclick="showStats('${link.short_code}', '${link.original_url}')" title="详细数据">
                                    <i class="fas fa-chart-line"></i>
                                </button>
                                <button class="action-btn delete" onclick="deleteLink('${link.short_code}')" title="彻底删除">
                                    <i class="far fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                updatePagination(links.length);
                
            } catch (err) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="state-icon" style="background: rgba(239, 68, 68, 0.1);">
                            <i class="fas fa-link-slash" style="color: var(--error);"></i>
                        </div>
                        <h3 class="state-title">服务连接失败</h3>
                        <p class="state-desc">无法连接到后端 API，请检查服务器状态或 API 密钥。</p>
                        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px;">
                            <button class="btn" style="width: auto;" onclick="loadLinks(1)">
                                <i class="fas fa-sync-alt"></i> 重试
                            </button>
                        </div>
                    </div>`;
            }
        }

        function updatePagination(itemCount) {
            let paginationHtml = '';
            
            // 只有当不在第一页，或者当前页满载（暗示可能有下一页）时才显示分页
            if (currentPage > 1 || itemCount === pageSize) {
                paginationHtml = `
                    <div style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                        <button 
                            class="btn-outline" 
                            onclick="loadLinks(${currentPage - 1})" 
                            ${currentPage === 1 ? 'disabled' : ''}
                            style="padding: 8px 16px; opacity: ${currentPage === 1 ? '0.5' : '1'}; cursor: ${currentPage === 1 ? 'not-allowed' : 'pointer'};">
                            <i class="fas fa-chevron-left"></i> 上一页
                        </button>
                        <span style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;">
                            第 ${currentPage} 页
                        </span>
                        <button 
                            class="btn-outline" 
                            onclick="loadLinks(${currentPage + 1})" 
                            ${itemCount < pageSize ? 'disabled' : ''}
                            style="padding: 8px 16px; opacity: ${itemCount < pageSize ? '0.5' : '1'}; cursor: ${itemCount < pageSize ? 'not-allowed' : 'pointer'};">
                            下一页 <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                `;
            }
            
            // 在链接容器后添加分页控件
            const container = document.getElementById('linksContainer');
            const existingPagination = container.nextElementSibling;
            if (existingPagination && existingPagination.id === 'paginationContainer') {
                existingPagination.remove();
            }
            
            if (paginationHtml) {
                const paginationDiv = document.createElement('div');
                paginationDiv.id = 'paginationContainer';
                paginationDiv.innerHTML = paginationHtml;
                container.parentNode.insertBefore(paginationDiv, container.nextSibling);
            }
        }

        async function deleteLink(code) {
            const confirmed = await showConfirm('确定要删除这个短链吗? 此操作无法撤销。');
            if (!confirmed) return;

            try {
                const res = await fetch(`${API_BASE}/api/${code}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                if (res.ok) {
                    showToast('删除成功', 'success');
                    loadLinks(1);  // 重置到第一页
                } else {
                    showToast('删除失败', 'error');
                }
            } catch (err) {
                showToast('请求失败', 'error');
            }
        }

        // 批量选择逻辑
        function toggleSelection(code, e) {
            // 阻止冒泡防止触发可能的卡片点击事件
            e.stopPropagation();
            
            const checkbox = e.target;
            if (selectedCodes.has(code)) {
                selectedCodes.delete(code);
                checkbox.checked = false;
            } else {
                selectedCodes.add(code);
                checkbox.checked = true;
            }
            
            updateBatchBar();
            
            // 局部更新卡片样式
            const card = checkbox.closest('.link-card');
            if (selectedCodes.has(code)) {
                card.style.background = 'var(--selection-bg)';
                card.style.borderColor = 'var(--primary)';
            } else {
                card.style.background = '';
                card.style.borderColor = '';
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.link-checkbox');
            checkboxes.forEach(cb => {
                // Extract code from onclick attribute
                const onclickAttr = cb.getAttribute('onclick');
                const match = onclickAttr.match(/'(.*?)'/);
                const code = match ? match[1] : null;

                if (code) {
                    if (selectAll.checked) {
                        selectedCodes.add(code);
                        cb.checked = true;
                    } else {
                        selectedCodes.delete(code);
                        cb.checked = false;
                    }
                    const card = cb.closest('.link-card');
                    if (selectedCodes.has(code)) {
                        card.style.background = 'var(--selection-bg)';
                        card.style.borderColor = 'var(--primary)';
                    } else {
                        card.style.background = '';
                        card.style.borderColor = '';
                    }
                }
            });
            updateBatchBar();
        }

        function updateBatchBar() {
            const bar = document.getElementById('batchActionBar');
            const countLabel = document.getElementById('selectedCount');
            const selectAll = document.getElementById('selectAll');
            
            if (selectedCodes.size > 0) {
                bar.style.display = 'flex';
                countLabel.textContent = `已选 ${selectedCodes.size} 项`;
                
                // 更新全选框状态
                const checkboxes = document.querySelectorAll('.link-checkbox');
                if (checkboxes.length > 0) {
                    let allChecked = true;
                    checkboxes.forEach(cb => {
                        const onclickAttr = cb.getAttribute('onclick');
                        const match = onclickAttr.match(/'(.*?)'/);
                        const code = match ? match[1] : null;
                        if (code && !selectedCodes.has(code)) allChecked = false;
                    });
                    selectAll.checked = allChecked;
                }
            } else {
                bar.style.display = 'none';
                selectAll.checked = false;
            }
        }

        async function deleteBatch() {
            if (selectedCodes.size === 0) return;
            
            const confirmed = await showConfirm(`确认删除选中的 ${selectedCodes.size} 条记录吗？此操作不可撤销。`);
            if (!confirmed) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/delete/batch`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ codes: Array.from(selectedCodes) })
                });

                if (res.ok) {
                    showToast('批量删除成功', 'success');
                    loadLinks(currentPage);
                } else {
                    const result = await res.json();
                    showToast(result.error || '批量删除失败', 'error');
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // 确认对话框
        let confirmCallback = null;

        function showConfirm(message, onConfirm) {
            confirmCallback = onConfirm;
            document.getElementById('confirmMessage').textContent = message;
            
            const modal = document.getElementById('confirmModal');
            modal.style.display = 'flex';
            modal.offsetHeight;
            modal.classList.add('show');
            
            document.getElementById('confirmBtn').onclick = async () => {
                if (confirmCallback) {
                    // 设置 Loading 状态
                    const btn = document.getElementById('confirmBtn');
                    const text = btn.querySelector('.btn-text');
                    const spinner = btn.querySelector('.loading-spinner');
                    
                    btn.disabled = true;
                    btn.style.opacity = '0.8';
                    btn.style.cursor = 'not-allowed';
                    text.style.display = 'none';
                    spinner.style.display = 'inline-block';
                    
                    try {
                        // 等待回调执行完成
                        await confirmCallback();
                    } catch (err) {
                    } finally {
                        // 无论成功失败，恢复状态并关闭
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        btn.style.cursor = 'pointer';
                        text.style.display = 'inline-block';
                        spinner.style.display = 'none';
                        closeConfirmModal();
                    }
                } else {
                    closeConfirmModal();
                }
            };
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
                confirmCallback = null;
            }, 250);
        }

        function closeConfirm(event) {
            if (event.target === document.getElementById('confirmModal')) {
                closeConfirmModal();
            }
        }

        function closeStatsModal() {
            const modal = document.getElementById('statsModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 250);
        }

        function closeStats(event) {
            if (event.target === document.getElementById('statsModal')) {
                closeStatsModal();
            }
        }

        // 回车提交
        document.getElementById('longUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createShortLink();
        });

                    const dateStr = expiresDate.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    if (data.is_expired) {
                        expiresHtml = `${dateStr} <span style="color: var(--error); font-weight: 600;">(已过期)</span>`;
                    } else {
                        expiresHtml = `<span style="color: var(--text-main);">${dateStr}</span>`;
                    }
                } else {
                    expiresHtml = '<span style="color: var(--success);">永不过期</span>';
                }
                
                // 重新构建 HTML 结构并添加淡入动画
                // 去除外层背景和边框，使用透明背景，内容紧凑排列
                keyInfoDiv.innerHTML = `
                    <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; font-size: 0.85rem; color: var(--text-secondary); align-items: center; padding: 4px 2px;">
                        <div style="display: flex; align-items: center; gap: 6px; margin-right: auto;">
                            <i class="fas fa-tag" style="color: var(--primary); font-size: 0.8rem;"></i>
                            <span style="color: var(--text-main); font-weight: 600;">${data.name}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 16px;">
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <i class="fas fa-chart-line" style="color: var(--primary); font-size: 0.8rem;"></i>
                                <span><strong style="color: var(--text-main);">${data.usage_count || 0}</strong> 次</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <i class="fas fa-clock" style="color: var(--primary); font-size: 0.8rem;"></i>
                                <span>${expiresHtml}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                // 添加淡入动画类
                keyInfoDiv.classList.remove('key-info-fade-in'); //  先移除以重置动画
                void keyInfoDiv.offsetHeight; // 强制浏览器重排，确保动画生效
                keyInfoDiv.classList.add('key-info-fade-in');
                
                keyInfoDiv.style.display = 'block';
                
            } catch (e) {
                keyInfoDiv.style.display = 'none';
            }
        }


        // 立即初始化主题
        initTheme();
    </script>
</body>
</html>
